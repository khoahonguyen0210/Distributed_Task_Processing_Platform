[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taskq"
version = "1.0.0"
description = "A small Redis-backed task queue with workers, retries, and a live dashboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "redis>=5.2,<8",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.queue" = ["lua/*.lua"]
"app.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["redis: needs a running Redis server"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "scripts"]

# redis-py types every call as "sync or async", which hides real errors in noise.
[[tool.mypy.overrides]]
module = ["redis", "redis.*"]
follow_imports = "skip"
follow_untyped_imports = true

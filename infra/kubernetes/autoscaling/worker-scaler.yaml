apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 5
  cooldownPeriod: 30
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
  triggers:
    - type: metrics-api
      metricType: AverageValue
      metadata:
        url: http://api.taskq.svc.cluster.local:8000/api/metrics
        valueLocation: backlog
        targetValue: "1"
        activationTargetValue: "0"

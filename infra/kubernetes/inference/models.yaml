apiVersion: v1
kind: PersistentVolume
metadata:
  name: taskq-models
spec:
  capacity:
    storage: 2Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /models
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: taskq-models
  resources:
    requests:
      storage: 2Gi

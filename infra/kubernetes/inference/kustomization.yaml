apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskq
resources:
  - ../autoscaling
  - models.yaml
  - model-server.yaml
  - model-server-scaler.yaml
  - prometheus.yaml
patches:
  - path: config.yaml
  - path: worker.yaml
  - target:
      kind: ScaledObject
      name: worker
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/targetValue
        value: "2"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskq
resources:
  - ../base
  - fake-model-server.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: taskq-config
      data:
        LLM_SERVER_URL: http://model-server:8080
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: worker
      spec:
        replicas: 2
